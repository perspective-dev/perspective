[package]
name = "perspective-migrate-js"
version = "5.6.1"
authors = ["Andrew Stein <steinlink@gmail.com>"]
edition = "2024"
description = "WebAssembly bindings for `perspective-migrate`, shipped with `@perspective-dev/client`."
repository = "https://github.com/perspective-dev/perspective"
license = "Apache-2.0"
homepage = "https://perspective-dev.github.io"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
perspective-migrate = { version = "5.6.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.107", features = ["preserve_order"] }
serde-wasm-bindgen = "0.6.0"
wasm-bindgen = { version = "=0.2.108" }
