[package]
name = "perspective-migrate"
version = "5.8.0"
authors = ["Andrew Stein <steinlink@gmail.com>"]
edition = "2024"
description = "Upgrades persisted Perspective `ViewConfig`, `<perspective-viewer>` and workspace configs from any release since 2.0 to the current schema."
repository = "https://github.com/perspective-dev/perspective"
license = "Apache-2.0"
homepage = "https://perspective-dev.github.io"
keywords = ["perspective", "migration", "config", "datagrid", "visualization"]
categories = ["visualization", "data-structures"]
documentation = "https://docs.rs/perspective-migrate"
include = ["src/**/*", "Cargo.toml"]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.107", features = ["preserve_order"] }
serde-wasm-bindgen = "0.6.0"
wasm-bindgen = { version = "=0.2.108" }

[dev-dependencies]
perspective-client = { path = "../perspective-client" }
