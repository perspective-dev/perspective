<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />

        <title>Perspective Minesweeper</title>

        <link rel="preload" href="perspective-viewer.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />
        <link rel="preload" href="perspective-server.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />

        <script type="module" src="index.js"></script>
        <link rel="stylesheet" href="index.css" />
    </head>
    <body data-state="ready">
        <header>
            <h1>Minesweeper</h1>
            <span id="mines-left" title="Mines left"></span>
            <span id="status"></span>
            <button id="new-game" type="button">New game</button>
        </header>
        <main>
            <perspective-viewer id="viewer"></perspective-viewer>
        </main>
    </body>
</html>
