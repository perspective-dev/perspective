<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no" />
        <link rel="preload" href="/node_modules/@perspective-dev/server/dist/wasm/perspective-server.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />
        <link rel="preload" href="/node_modules/@perspective-dev/viewer/dist/wasm/perspective-viewer.wasm" as="fetch" type="application/wasm" crossorigin="anonymous" />
        <link rel="stylesheet" crossorigin="anonymous" href="/node_modules/@perspective-dev/viewer/dist/css/themes.css" />
        <style>
            body {
                overflow: hidden;
                margin: 0;
                background: #242526;
                font-family: "ui-monospace", "SFMono-Regular", "SF Mono", "Menlo", monospace;
            }

            perspective-viewer {
                position: absolute;
                inset: 0;
            }

            /* The configuration is modal because the agent is unusable
             * until it is answered - and it stays up until `Apply`
             * SUCCEEDS, since a rejected key or an unreachable server
             * needs to be corrected in place rather than reported to a
             * form that has already gone. */
            #agent_modal_backdrop {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.55);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
            }

            #agent_modal_backdrop[hidden] {
                display: none;
            }

            #agent_modal {
                width: 460px;
                max-width: calc(100vw - 32px);
                max-height: calc(100vh - 32px);
                overflow-y: auto;
                box-sizing: border-box;
                background: #242526;
                border: 1px solid #4c5057;
                border-radius: 6px;
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
                color: #b4b7bd;
                font-size: 12px;
                padding: 20px 22px;
            }

            #agent_modal h1 {
                font-size: 14px;
                font-weight: 600;
                margin: 0 0 4px;
                color: #e0e2e6;
            }

            #agent_modal p.intro {
                margin: 0 0 18px;
                line-height: 1.5;
            }

            #agent_modal label {
                display: block;
                margin-bottom: 12px;
            }

            #agent_modal .field_name {
                display: block;
                margin-bottom: 4px;
                color: #8b8f96;
            }

            #agent_modal select,
            #agent_modal input {
                width: 100%;
                box-sizing: border-box;
                background: #1c1e20;
                color: inherit;
                border: 1px solid #4c5057;
                border-radius: 3px;
                font-family: inherit;
                font-size: inherit;
                padding: 5px 7px;
            }

            #agent_modal input:disabled,
            #agent_modal select:disabled {
                opacity: 0.5;
            }

            #agent_modal .actions {
                display: flex;
                align-items: center;
                gap: 12px;
                margin-top: 18px;
            }

            #agent_modal button {
                background: #1c1e20;
                color: inherit;
                border: 1px solid #4c5057;
                border-radius: 3px;
                font-family: inherit;
                font-size: inherit;
                padding: 5px 16px;
                cursor: pointer;
            }

            #agent_modal button:disabled {
                opacity: 0.5;
                cursor: default;
            }

            #status {
                flex: 1 1 auto;
                line-height: 1.4;
                overflow-wrap: anywhere;
            }

        </style>
    </head>
    <body>
        <perspective-viewer id="viewer"></perspective-viewer>
        <div id="agent_modal_backdrop">
            <div id="agent_modal" role="dialog" aria-modal="true" aria-labelledby="agent_modal_title">
                <h1 id="agent_modal_title">Configure the agent</h1>
                <p class="intro">
                    Pick a provider to enable the chat sidebar. Once applied, a
                    <strong>Chat</strong> tab appears in the viewer's settings sidebar - ask it something like "Show me Sales by Region as a bar chart".
                </p>
                <label>
                    <span class="field_name">Provider</span>
                    <select id="provider"></select>
                </label>
                <label>
                    <span class="field_name">Endpoint</span>
                    <input id="url" type="text" />
                </label>
                <label>
                    <span class="field_name">Model</span>
                    <input id="model" type="text" list="model_suggestions" />
                    <datalist id="model_suggestions"></datalist>
                </label>
                <label>
                    <span class="field_name">API key</span>
                    <input id="api_key" type="password" />
                </label>
                <div class="actions">
                    <button id="apply">Apply</button>
                    <span id="status"></span>
                </div>
            </div>
        </div>
        <script type="module">
            import { providers } from "/node_modules/@perspective-dev/viewer/dist/cdn/perspective-viewer.js";
            import "/node_modules/@perspective-dev/viewer-datagrid/dist/cdn/perspective-viewer-datagrid.js";
            import "/node_modules/@perspective-dev/viewer-charts/dist/cdn/perspective-viewer-charts.js";
            import perspective from "/node_modules/@perspective-dev/client/dist/cdn/perspective.js";
            import CORPUS from "/node_modules/@perspective-dev/viewer/dist/docs/perspective-docs.json" with { type: "json" };
            const DATA_URL = "/node_modules/superstore-arrow/superstore.lz4.arrow";

            // What a host knows about its own data and the schema does not
            // say. This rides in the CORPUS rather than in `systemPrompt`:
            // `search_docs` retrieves it when a question actually touches
            // it, so it costs nothing on the turns that do not - whereas a
            // system prompt is re-sent on every request of every
            // conversation. This is the data-dictionary channel `docs`
            // exists for, and it is why the demo needs no system prompt at
            // all.
            const DATASET_DOCS = [
                {
                    title: "Dataset: superstore",
                    text:
                        "The loaded `superstore` table is a retail order " +
                        "log - one row per product line of an order, with " +
                        "customer, geography (Country/Region/State/City/" +
                        "Postal Code), product (Category/Sub-Category/" +
                        "Product Name), dates (Order Date, Ship Date) and " +
                        "the financial columns Sales, Quantity, Discount " +
                        "and Profit.",
                },
                {
                    title: "Dataset: superstore column semantics",
                    text:
                        "`Discount` is a ratio in [0, 1], not a percent - " +
                        "0.2 means 20% off. `Profit` is net of discounts " +
                        "and can be NEGATIVE, so profitability questions " +
                        "want a sum rather than a count, and a loss shows " +
                        "as a negative bar. `Sales` is the line total " +
                        "AFTER discount. Segment is the customer type " +
                        "(Consumer / Corporate / Home Office).",
                },
            ];
            const BROWSER_KEY_WARNING = "The key is sent directly from this browser tab - " + "suitable for local development only.";

            // WebLLM is the one connection that is NOT a `providers`
            // preset: presets are `url` connections, and an in-browser
            // engine is passed as `engine` instead (the two are mutually
            // exclusive). The host constructs it, which is why the viewer
            // does not bundle `@mlc-ai/web-llm` - it is a multi-GB model
            // runtime that only some pages want.
            //
            // Only the Hermes family is listed: WebLLM rejects OpenAI
            // `tools` requests for every other prebuilt model, and the
            // agent is a tool loop. This is WebLLM's own
            // `functionCallingModelIds` allowlist, verbatim (v0.2.84).
            const WEBLLM_URL = "https://esm.run/@mlc-ai/web-llm";
            // WebLLM ships EVERY prebuilt model with
            // `context_window_size: 4096`, which this agent cannot work
            // in: its tool definitions alone are ~6k tokens of JSON
            // Schema (the two config tools each carry a generated
            // `ViewerConfigUpdate` / `ViewerConfigInitial` schema),
            // before any preamble or conversation. `chatOpts` raises it,
            // bounded by the base model's architecture:
            //
            //   Llama-3-8B       8192 (hard architectural limit)
            //   Llama-3.1-8B     131072
            //   Mistral-7B-v0.3  32768
            //
            // The KV cache is the real cost - roughly 128KB per token
            // for these 8B/7B GQA models - so 16k tokens is ~2GB on top
            // of ~5GB of weights, which fits an 8GB GPU. Raise the 3.1
            // and Mistral entries if yours has more.
            const WEBLLM_CONTEXT = 16384;
            const WEBLLM_MODELS = [
                {
                    id: "Hermes-3-Llama-3.1-8B-q4f16_1-MLC",
                    context: WEBLLM_CONTEXT,
                },
                {
                    id: "Hermes-3-Llama-3.1-8B-q4f32_1-MLC",
                    context: WEBLLM_CONTEXT,
                },
                {
                    id: "Hermes-2-Pro-Mistral-7B-q4f16_1-MLC",
                    context: WEBLLM_CONTEXT,
                },
                { id: "Hermes-2-Pro-Llama-3-8B-q4f16_1-MLC", context: 8192 },
                { id: "Hermes-2-Pro-Llama-3-8B-q4f32_1-MLC", context: 8192 },
            ];

            const WEBLLM_MODEL_IDS = WEBLLM_MODELS.map((x) => x.id);

            // Engines are expensive to build (weights are cached by the
            // browser, but init is not), so keep one per model id.
            const webllm_engines = new Map();

            async function webllm_engine(model, on_progress) {
                if (!webllm_engines.has(model)) {
                    const { CreateMLCEngine } = await import(WEBLLM_URL);
                    const context = WEBLLM_MODELS.find((x) => x.id === model)?.context ?? WEBLLM_CONTEXT;

                    webllm_engines.set(
                        model,
                        await CreateMLCEngine(
                            model,
                            {
                                initProgressCallback: (p) => on_progress(p.text),
                            },
                            { context_window_size: context },
                        ),
                    );
                }

                return webllm_engines.get(model);
            }

            // Form hints per preset; the connection facts themselves live in
            // the `providers` presets.
            const HINTS = {
                lmstudio: {
                    api_key: "API key (optional)",
                    models: ["qwen/qwen3-8b", "meta-llama-3.1-8b-instruct"],
                    ready: "Enable CORS in LM Studio's developer-server settings.",
                },
                ollama: {
                    api_key: "API key (optional)",
                    models: ["llama3.1", "qwen3"],
                    ready: "Set OLLAMA_ORIGINS to allow this origin.",
                },
                anthropic: {
                    api_key: "sk-ant-... (required)",
                    models: ["claude-opus-5", "claude-sonnet-5", "claude-haiku-4-5"],
                    ready: BROWSER_KEY_WARNING,
                },
                gemini: {
                    api_key: "AIza... (required)",
                    models: ["gemini-2.5-flash", "gemini-2.5-pro"],
                    ready: BROWSER_KEY_WARNING,
                },
                openrouter: {
                    api_key: "sk-or-... (required)",
                    models: ["openrouter/auto"],
                    ready: BROWSER_KEY_WARNING,
                },
                openai: {
                    api_key: "sk-... (required)",
                    models: ["gpt-5.2"],
                    ready: BROWSER_KEY_WARNING,
                },
                webllm: {
                    models: WEBLLM_MODEL_IDS,
                    ready:
                        "Runs in this tab on WebGPU - nothing leaves the " +
                        "machine. First use downloads GBs of weights. " +
                        "WebLLM only accepts tool calls from the Hermes " +
                        "family, and rejects any system message alongside " +
                        'them - so this uses `systemRole: "user"`, which ' +
                        "sends the preamble in the opening user turn.",
                },
            };

            const provider = document.querySelector("#provider");
            const url = document.querySelector("#url");
            const model = document.querySelector("#model");
            const suggestions = document.querySelector("#model_suggestions");
            const api_key = document.querySelector("#api_key");
            const status = document.querySelector("#status");

            provider.replaceChildren(
                ...[...Object.keys(providers), "webllm"].map((name) => {
                    const option = document.createElement("option");
                    option.value = name;
                    option.textContent = name;
                    return option;
                }),
            );

            provider.value = "lmstudio";

            function sync_form() {
                const is_webllm = provider.value === "webllm";
                const preset = providers[provider.value] ?? {};
                const hints = HINTS[provider.value] ?? {};

                // An in-browser engine has neither an endpoint nor a key.
                url.disabled = is_webllm;
                api_key.disabled = is_webllm;
                url.value = is_webllm ? "" : preset.url;
                url.placeholder = is_webllm ? "(in-browser engine)" : "";
                model.value = is_webllm ? WEBLLM_MODEL_IDS[0] : (preset.model ?? "");
                model.placeholder = is_webllm ? "(WebLLM model id)" : "(server's loaded model)";

                api_key.value = "";
                api_key.placeholder = is_webllm ? "(not used)" : (hints.api_key ?? "API key");
                suggestions.replaceChildren(
                    ...(hints.models ?? []).map((name) => {
                        const option = document.createElement("option");
                        option.value = name;
                        return option;
                    }),
                );

                status.textContent = hints.ready ?? "";
            }

            provider.addEventListener("change", sync_form);
            sync_form();

            // The viewer loads first - the agent is optional chrome on top
            // of a fully functional Perspective.
            const request = fetch(DATA_URL);
            const worker = await perspective.worker();
            const response = await request;
            const buffer = await response.arrayBuffer();
            await worker.table(buffer, { name: "superstore" });
            const viewer = document.querySelector("#viewer");
            await viewer.load(worker);
            await viewer.restore({
                table: "superstore",
                settings: true,
            });

            const backdrop = document.querySelector("#agent_modal_backdrop");

            // Deliberately no backdrop-click or Escape dismissal: the form
            // closes on a SUCCESSFUL apply and nothing else, so a rejected
            // key or an unreachable server is corrected in the form that
            // reported it - and a long WebLLM download reports progress in
            // place rather than behind a dialog the user already closed.
            function open_modal() {
                backdrop.hidden = false;
                provider.focus();
            }

            function close_modal() {
                backdrop.hidden = true;
            }

            const apply = document.querySelector("#apply");
            apply.addEventListener("click", async () => {
                const is_webllm = provider.value === "webllm";
                const config = {
                    // Perspective's packaged corpus, plus this host's own
                    // notes about the data - one searchable index.
                    docs: {
                        ...CORPUS,
                        chunks: [...CORPUS.chunks, ...DATASET_DOCS],
                    },
                };

                if (is_webllm) {
                    config.name = "webllm";

                    // WebLLM throws `CustomSystemPromptError` on ANY
                    // system message when `tools` is present - it
                    // substitutes its own carrying the tool definitions -
                    // so the preamble has to ride in the first user turn.
                    config.systemRole = "user";
                } else {
                    Object.assign(config, providers[provider.value], {
                        url: url.value.trim(),
                    });
                }

                if (model.value.trim()) {
                    config.model = model.value.trim();
                }

                if (!is_webllm && api_key.value.trim()) {
                    config.apiKey = api_key.value.trim();
                }

                try {
                    if (is_webllm) {
                        // Downloading weights takes minutes on a cold
                        // cache, so report progress and keep the button
                        // from queueing a second engine build.
                        apply.disabled = true;
                        status.textContent = "Loading WebLLM\u2026";
                        config.engine = await webllm_engine(config.model ?? WEBLLM_MODEL_IDS[0], (text) => {
                            status.textContent = text;
                        });
                    }

                    viewer.agentConfig(config);

                    // Only a SUCCESSFUL configuration dismisses the form.
                    close_modal();
                    status.textContent = "";
                } catch (error) {
                    status.textContent = `${error.message ?? error}`;
                } finally {
                    apply.disabled = false;
                }
            });
        </script>
    </body>
</html>
